{% extends "base.html" %}
{% block title %}Log in - MixSync{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p role="alert">Invalid username or password.</p>{% endif %}
<form method="post" action="/login">
  <p><label>Username <input name="username" type="text" autocomplete="username" required autofocus></label></p>
  <p><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
  <button type="submit">Log in</button>
</form>
{% endblock %}
