name: ci
on:
  push:
    branches: [main, dev] # PR branches are covered by pull_request; pushing them too ran CI twice
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # `check` is a required status check, so docs-only changes skip it with a job `if:` (a skipped
  # job counts as passing) instead of paths-ignore (which would leave the PR waiting forever).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"  # unknown base: check everything
          # --no-renames: a file moved into docs/ must still count its old path. A failed diff
          # also means code: never skip on an error.
          elif ! git diff --no-renames --name-only "$BASE" HEAD > changed.txt ||
            grep -qvE '^docs/|\.md$' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    # Fail closed: if `changes` itself broke, run everything rather than skip the required check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -n auto
  # Same suite on Postgres. Required by the dev and main rulesets (with `check`); on docs-only changes it skips like `check`.
  postgres:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mixsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      MIXSYNC_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/mixsync_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - run: uv sync --frozen
      - run: uv run pytest -n auto --db=postgres
      - run: uv run pytest -m crash --db=postgres
