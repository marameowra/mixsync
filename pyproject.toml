[project]
name = "mixsync"
version = "0.1.0"
description = "Self-hosted music stack: download, verify, organize, hand off."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "jinja2",
    "httpx",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "mutagen>=1.48.1",
]

[project.scripts]
mixsync = "mixsync.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
    "import-linter",
    "hypothesis>=6.168.5",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.remove".msg = "Nothing deletes except purge(); move to the trash via library.fileops."
"os.unlink".msg = "Nothing deletes except purge(); move to the trash via library.fileops."
"os.rmdir".msg = "Nothing deletes except purge(); move to the trash via library.fileops."
"os.removedirs".msg = "Nothing deletes except purge(); move to the trash via library.fileops."
"shutil.rmtree".msg = "Nothing deletes except purge(); move to the trash via library.fileops."
"pathlib.Path.unlink".msg = "Nothing deletes except purge(); move to the trash via library.fileops."
"pathlib.Path.rmdir".msg = "Nothing deletes except purge(); move to the trash via library.fileops."

[tool.pyright]
include = ["src"]
strict = ["src"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs docker compose (slskd, Navidrome, MixSync)",
    "crash: SIGKILL crash-safety tests",
]
addopts = "-m 'not integration and not crash'"

[tool.importlinter]
root_package = "mixsync"

# Only modules that exist today are listed (import-linter errors on missing modules).
# Extend as ratelimit, adapters, match, library, services land. See src/mixsync/README.md.
[[tool.importlinter.contracts]]
name = "core imports nothing internal"
type = "forbidden"
source_modules = ["mixsync.core"]
forbidden_modules = ["mixsync.db", "mixsync.web", "mixsync.app"]

[[tool.importlinter.contracts]]
name = "db imports only core"
type = "forbidden"
source_modules = ["mixsync.db"]
forbidden_modules = ["mixsync.web", "mixsync.app"]

[[tool.importlinter.contracts]]
name = "ratelimit imports only core and db"
type = "forbidden"
source_modules = ["mixsync.ratelimit"]
forbidden_modules = ["mixsync.web", "mixsync.app"]

[[tool.importlinter.contracts]]
name = "metadata imports only core and ratelimit"
type = "forbidden"
source_modules = ["mixsync.metadata"]
forbidden_modules = ["mixsync.db", "mixsync.match", "mixsync.web", "mixsync.app"]
allow_indirect_imports = true  # ratelimit itself reaches db

[[tool.importlinter.contracts]]
name = "match imports only core"
type = "forbidden"
source_modules = ["mixsync.match"]
forbidden_modules = ["mixsync.db", "mixsync.ratelimit", "mixsync.web", "mixsync.app"]

[[tool.importlinter.contracts]]
name = "sources imports only core and ratelimit"
type = "forbidden"
source_modules = ["mixsync.sources"]
forbidden_modules = ["mixsync.db", "mixsync.match", "mixsync.metadata", "mixsync.web", "mixsync.app"]
allow_indirect_imports = true  # ratelimit itself reaches db

[[tool.importlinter.contracts]]
name = "library imports only core, db and match"
type = "forbidden"
source_modules = ["mixsync.library"]
forbidden_modules = [
    "mixsync.ratelimit",
    "mixsync.sources",
    "mixsync.metadata",
    "mixsync.web",
    "mixsync.app",
]
allow_indirect_imports = true  # db itself may reach ratelimit

[[tool.importlinter.contracts]]
name = "acquire imports only core, db, match and library"
type = "forbidden"
source_modules = ["mixsync.acquire"]
forbidden_modules = [
    "mixsync.ratelimit",
    "mixsync.sources",
    "mixsync.metadata",
    "mixsync.targets",
    "mixsync.web",
    "mixsync.app",
    "mixsync.worker",
]
allow_indirect_imports = true  # db itself may reach ratelimit

[[tool.importlinter.contracts]]
name = "targets imports only core and ratelimit"
type = "forbidden"
source_modules = ["mixsync.targets"]
forbidden_modules = [
    "mixsync.db",
    "mixsync.match",
    "mixsync.library",
    "mixsync.metadata",
    "mixsync.sources",
    "mixsync.acquire",
    "mixsync.web",
    "mixsync.app",
]
allow_indirect_imports = true  # ratelimit itself reaches db
