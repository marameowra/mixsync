<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>body{padding:16px;}</style></head>
<body>
<form class="stack">
<div class="field"><label for="f1">Album artist</label><input class="input" id="f1" type="text" value="Broadcast"></div>
<div class="field"><label for="f2">Retention (days)</label><input class="input num" id="f2" type="text" inputmode="numeric" value="30" aria-describedby="f2h"><span class="help" id="f2h">Applies to tracks imported from now on, not to ones already in discover.</span></div>
<div class="field invalid"><label for="f3">Release (MusicBrainz URL or MBID)</label><input class="input" id="f3" type="text" value="tender buttons" aria-invalid="true" aria-describedby="f3e"><span class="error" id="f3e">Not a MusicBrainz release URL or MBID.</span></div>
</form>
</body>
</html>
