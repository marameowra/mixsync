{% extends "base.html" %}
{% block title %}Log in - MixSync{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error == "invalid" %}<p class="notice danger" role="alert"><span aria-hidden="true">✕</span> Invalid username or password.</p>{% endif %}
{% if error == "locked" %}<p class="notice danger" role="alert"><span aria-hidden="true">✕</span> Too many attempts, try again later.</p>{% endif %}
<form method="post" action="/login">
  {{ forms.csrf() }}
  <p class="field"><label>Username <input name="username" type="text" autocomplete="username" required autofocus></label></p>
  <p class="field"><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
  <button class="primary" type="submit">Log in</button>
</form>
{% endblock %}
