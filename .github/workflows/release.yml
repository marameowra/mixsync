name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for a human to approve in the GitHub UI (environment protection rule).
    environment: release
    steps:
      - uses: actions/checkout@v4
      # Image tags drop the git tag's "v" (v1.0.0 -> :1.0.0), per Docker convention.
      - id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marameowra/mixsync:${{ steps.version.outputs.tag }}
            ghcr.io/marameowra/mixsync:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
